# ============================================================================
# Local Development Docker Compose for Apache Airflow 3.4.0 (LocalExecutor)
# Project: Global Restaurant Explorer Platform ETL
#
# WARNING: This configuration is for local development & testing only.
# - Web/API UI is bound strictly to 127.0.0.1:8080 (not exposed publicly).
# - Never commit a populated .env file or real credentials.
# ============================================================================

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
  image: global-restaurant-explorer-airflow:3.4.0-py3.11
  env_file:
    - .env
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-apiserver:8080/execution/"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://${AIRFLOW_PG_USER:-airflow}:${AIRFLOW_PG_PASSWORD:-airflow}@airflow-postgres/${AIRFLOW_PG_DB:-airflow}"
    AIRFLOW__API_AUTH__JWT_SECRET: "${AIRFLOW_JWT_SECRET:-change-me-local-dev-jwt-secret}"
    AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW_FERNET_KEY:-}"
    ETL_PROJECT_ROOT: "/opt/airflow/etl_project"
    ETL_SOURCE_CSV: "${ETL_SOURCE_CSV:-data/zomato_cleaned.csv}"
    DB_DIALECT: "${DB_DIALECT:-mysql}"
    STORAGE_BACKEND: "${STORAGE_BACKEND:-local}"
    PYTHONPATH: "/opt/airflow/etl_project:/opt/airflow/include"
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./include:/opt/airflow/include:ro
    - ./tests:/opt/airflow/tests:ro
    - ${ETL_PROJECT_HOST_PATH:-../global_restaurant_explorer_etl}:/opt/airflow/etl_project
    - airflow-logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    airflow-postgres:
      condition: service_healthy

services:
  airflow-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "${AIRFLOW_PG_USER:-airflow}"
      POSTGRES_PASSWORD: "${AIRFLOW_PG_PASSWORD:-airflow}"
      POSTGRES_DB: "${AIRFLOW_PG_DB:-airflow}"
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_PG_USER:-airflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        echo "Airflow 3.4.0 metadata database initialized."
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/api/v2/version || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  airflow-postgres-data:
  airflow-logs:
