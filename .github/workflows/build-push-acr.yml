name: Build and Push Images to ACR

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - refactor/infra-increment1-platform
    paths:
      - "config/**"
      - "pipeline/**"
      - "sql/**"
      - "web/**"
      - ".github/workflows/build-push-acr.yml"

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: web/backend/Dockerfile
          - name: streamlit
            dockerfile: web/streamlit/Dockerfile
          - name: pipeline
            dockerfile: pipeline/Dockerfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name acreatosphere2611

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            acreatosphere2611.azurecr.io/${{ matrix.name }}:${{ github.sha }}
            acreatosphere2611.azurecr.io/${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
